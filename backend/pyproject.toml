[project]
name = "neu-lms-backend"
version = "0.1.0"
description = "NEU LMS modular backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.40,<2",
    "celery[redis]>=5.5,<6",
    "django>=5.2,<5.3",
    "djangorestframework>=3.18.3,<3.19",
    "drf-spectacular>=0.28,<1",
    "gunicorn>=23,<24",
    "psycopg[binary]>=3.2,<4",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

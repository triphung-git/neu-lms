# Local development only. All published ports bind to loopback.
name: neu-lms

services:
  postgres:
    image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: ${PGDATABASE:?Copy .env.example to .env}
      POSTGRES_USER: ${PGUSER:?Set PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Set PGPASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  s3:
    # Protocol emulator only: no production IAM/security guarantees.
    image: adobe/s3mock:5.1.0@sha256:65cf60155a2e235fe7d5bf6c633747d6fc7ed93f9f5a6727d86470026b83c2a2
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: neu-lms-local
    ports:
      - "127.0.0.1:${S3_PORT:-59090}:9090"
    volumes:
      - s3-data:/s3mockroot

  mailpit:
    image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-18025}:8025"

  api:
    build:
      context: ./backend
      target: runtime
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      PGHOST: postgres
      PGPORT: "5432"
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
      FILES_STORAGE_BACKEND: s3
      FILES_S3_ENDPOINT: http://s3:9090
      FILES_S3_BUCKET: neu-lms-local
      AWS_ACCESS_KEY_ID: local-emulator
      AWS_SECRET_ACCESS_KEY: local-emulator
      CLAMAV_HOST: clamav
      CELERY_BROKER_URL: redis://redis:6379/1
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 10s

  clamav:
    profiles: [files]
    image: clamav/clamav:1.5.4@sha256:bda39705e291105049c3936e2803ac90b955172af8030f94f05dce1252df6c6d
    volumes:
      - clamav-data:/var/lib/clamav

  file-worker:
    profiles: [files]
    build:
      context: ./backend
      target: runtime
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file: .env
    environment: &file-environment
      DJANGO_SETTINGS_MODULE: config.settings.local
      PGHOST: postgres
      PGPORT: "5432"
      FILES_STORAGE_BACKEND: s3
      FILES_S3_ENDPOINT: http://s3:9090
      FILES_S3_BUCKET: neu-lms-local
      AWS_ACCESS_KEY_ID: local-emulator
      AWS_SECRET_ACCESS_KEY: local-emulator
      CLAMAV_HOST: clamav
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_started
      clamav:
        condition: service_started

  file-scheduler:
    profiles: [files]
    build:
      context: ./backend
      target: runtime
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule", "--pidfile=/tmp/celerybeat.pid"]
    env_file: .env
    environment: *file-environment
    depends_on:
      redis:
        condition: service_healthy

  auth-dispatcher:
    build:
      context: ./backend
      target: runtime
    command: ["python", "manage.py", "dispatch_auth_emails", "--daemon", "--poll-interval", "2"]
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      PGHOST: postgres
      PGPORT: "5432"
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped


volumes:
  clamav-data:
  postgres-data:
  redis-data:
  s3-data:
